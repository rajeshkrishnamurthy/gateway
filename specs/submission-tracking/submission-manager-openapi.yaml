{
  "openapi": "3.0.3",
  "info": {
    "title": "SubmissionManager API",
    "version": "1.0.0",
    "description": "Canonical HTTP contract for the SubmissionManager bounded context."
  },
  "paths": {
    "/docs": {
      "get": {
        "summary": "Live Swagger UI documentation for SubmissionManager API",
        "responses": {
          "200": {
            "description": "Swagger UI HTML page.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "405": {
            "description": "Method not allowed.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/healthz": {
      "get": {
        "summary": "Process health check",
        "responses": {
          "200": {
            "description": "Process is running.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "405": {
            "description": "Method not allowed.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/metrics": {
      "get": {
        "summary": "Prometheus metrics",
        "responses": {
          "200": {
            "description": "Prometheus metrics payload.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "404": {
            "description": "Metrics are not configured."
          },
          "405": {
            "description": "Method not allowed.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/openapi.json": {
      "get": {
        "summary": "Live OpenAPI document generated from service code",
        "responses": {
          "200": {
            "description": "OpenAPI 3.0 JSON document.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "405": {
            "description": "Method not allowed.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "500": {
            "description": "Unable to generate OpenAPI document.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/readyz": {
      "get": {
        "summary": "Readiness and role status",
        "responses": {
          "200": {
            "description": "Process is ready and reports role state.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "405": {
            "description": "Method not allowed.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/ui/history": {
      "post": {
        "summary": "Render intent history HTML fragment (enabled when SubmissionManager UI templates are configured)",
        "requestBody": {
          "required": true,
          "content": {
            "application/x-www-form-urlencoded": {
              "schema": {
                "properties": {
                  "intentId": {
                    "type": "string"
                  }
                },
                "required": [
                  "intentId"
                ],
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Rendered HTML history fragment.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "description": "Invalid form or missing intentId.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "404": {
            "description": "Intent not found.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "405": {
            "description": "Method not allowed.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "500": {
            "description": "Manager not configured or template render error.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/v1/intents": {
      "post": {
        "summary": "Create or query an intent (idempotent)",
        "parameters": [
          {
            "name": "waitSeconds",
            "in": "query",
            "required": false,
            "description": "Optional synchronous wait duration in seconds. Must be a non-negative integer. Values greater than 30 are clamped to 30.",
            "schema": {
              "minimum": 0,
              "type": "integer"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SubmitIntentRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Intent accepted for orchestration or current idempotent state.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/IntentResponse"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request body, invalid waitSeconds, missing required fields, or unknown submission target.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "Intent not found after synchronous wait reconciliation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "405": {
            "description": "Method not allowed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "409": {
            "description": "Idempotency conflict for intentId.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "500": {
            "description": "Internal error.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/intents/{intentId}": {
      "get": {
        "summary": "Get current intent state",
        "parameters": [
          {
            "name": "intentId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Current intent state.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/IntentResponse"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request path.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "Intent not found.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "405": {
            "description": "Method not allowed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/intents/{intentId}/history": {
      "get": {
        "summary": "Get intent state with ordered attempt history",
        "parameters": [
          {
            "name": "intentId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Intent state and attempt history.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/IntentHistoryResponse"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request path.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "Intent not found.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "405": {
            "description": "Method not allowed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "AttemptResponse": {
        "properties": {
          "attemptNumber": {
            "type": "integer"
          },
          "error": {
            "type": "string"
          },
          "finishedAt": {
            "format": "date-time",
            "type": "string"
          },
          "outcomeReason": {
            "type": "string"
          },
          "outcomeStatus": {
            "type": "string"
          },
          "startedAt": {
            "format": "date-time",
            "type": "string"
          }
        },
        "required": [
          "attemptNumber"
        ],
        "type": "object"
      },
      "ErrorBody": {
        "properties": {
          "code": {
            "type": "string"
          },
          "details": {
            "additionalProperties": {
              "type": "string"
            },
            "type": "object"
          },
          "message": {
            "type": "string"
          }
        },
        "required": [
          "code",
          "message"
        ],
        "type": "object"
      },
      "ErrorResponse": {
        "properties": {
          "error": {
            "$ref": "#/components/schemas/ErrorBody"
          }
        },
        "required": [
          "error"
        ],
        "type": "object"
      },
      "IntentHistoryResponse": {
        "properties": {
          "attempts": {
            "items": {
              "$ref": "#/components/schemas/AttemptResponse"
            },
            "type": "array"
          },
          "intent": {
            "$ref": "#/components/schemas/IntentResponse"
          }
        },
        "required": [
          "intent",
          "attempts"
        ],
        "type": "object"
      },
      "IntentResponse": {
        "properties": {
          "completedAt": {
            "format": "date-time",
            "type": "string"
          },
          "createdAt": {
            "format": "date-time",
            "type": "string"
          },
          "exhaustedReason": {
            "type": "string"
          },
          "intentId": {
            "type": "string"
          },
          "rejectedReason": {
            "type": "string"
          },
          "status": {
            "enum": [
              "pending",
              "accepted",
              "rejected",
              "exhausted"
            ],
            "type": "string"
          },
          "submissionTarget": {
            "type": "string"
          }
        },
        "required": [
          "intentId",
          "submissionTarget",
          "createdAt",
          "status"
        ],
        "type": "object"
      },
      "SubmitIntentRequest": {
        "properties": {
          "intentId": {
            "type": "string"
          },
          "payload": {
            "description": "Opaque JSON payload forwarded to the resolved gateway contract."
          },
          "submissionTarget": {
            "type": "string"
          }
        },
        "required": [
          "intentId",
          "submissionTarget"
        ],
        "type": "object"
      }
    }
  }
}
